[package]
name = "sv-calendar"
description = "Riunioni dal calendario per Sottovoce: OAuth desktop (PKCE + loopback) e lettura eventi di Google Calendar"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "http2", "rustls-no-provider"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
