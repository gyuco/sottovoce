<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <!--
    Icona di Sottovoce: l'onda della voce che passa da "Io" (arancione) a "Loro" (blu).
    Riquadro secondo la griglia Apple (824×824 su 1024) per macOS/Windows/Linux.
    Sorgente: `pnpm tauri icon src-tauri/icons/source.svg`.
  -->
  <defs>
    <linearGradient id="bg" x1="180" y1="120" x2="860" y2="910" gradientUnits="userSpaceOnUse">
      <stop stop-color="#272420" />
      <stop offset="0.55" stop-color="#14120F" />
      <stop offset="1" stop-color="#0A0908" />
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(318 268) rotate(54) scale(600)">
      <stop stop-color="#FFFFFF" stop-opacity="0.13" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="voice" x1="228" y1="512" x2="796" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8B4A" />
      <stop offset="0.32" stop-color="#F9B27E" />
      <stop offset="0.5" stop-color="#F6EDE3" />
      <stop offset="0.7" stop-color="#B9C6EA" />
      <stop offset="1" stop-color="#5578F0" />
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" />
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)" />
  <rect x="102.5" y="102.5" width="819" height="819" rx="183.5" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5" />

  <g fill="url(#voice)">
    <rect x="201" y="422" width="82" height="180" rx="41" />
    <rect x="336" y="322" width="82" height="380" rx="41" />
    <rect x="471" y="232" width="82" height="560" rx="41" />
    <rect x="606" y="342" width="82" height="340" rx="41" />
    <rect x="741" y="442" width="82" height="140" rx="41" />
  </g>
</svg>
