[package]
name = "sottovoce"
description = "Assistente desktop per meeting: trascrive, traduce, suggerisce, riassume"
authors = ["Giuseppe Concas"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Il suffisso `_lib` evita conflitti tra nome lib e bin su Windows (cargo#8519).
name = "sottovoce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sv-audio.workspace = true
sv-stt.workspace = true
sv-llm.workspace = true
sv-models.workspace = true
sv-stt-local.workspace = true
sv-stt-chunked.workspace = true
sv-vad.workspace = true
sv-diar.workspace = true
sv-store.workspace = true
sv-embed.workspace = true
sv-search.workspace = true
sv-calendar.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
keyring = "4"
# SMTP per l'invio del riepilogo: rustls (ring) e certificati di sistema.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSGraphics"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
