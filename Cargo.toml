[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
sv-audio = { path = "crates/sv-audio" }
sv-stt = { path = "crates/sv-stt" }
sv-llm = { path = "crates/sv-llm" }
sv-models = { path = "crates/sv-models" }
sv-vad = { path = "crates/sv-vad" }
sv-stt-local = { path = "crates/sv-stt-local" }
sv-diar = { path = "crates/sv-diar" }
sv-store = { path = "crates/sv-store" }
sv-embed = { path = "crates/sv-embed" }
sv-search = { path = "crates/sv-search" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# DSP in Rust puro: senza ottimizzazioni AEC3 non sta in tempo reale
# nemmeno nei build debug (`pnpm app:debug`).
[profile.dev.package."sonora"]
opt-level = 3
[profile.dev.package."sonora-aec3"]
opt-level = 3
[profile.dev.package."sonora-common-audio"]
opt-level = 3
[profile.dev.package."sonora-fft"]
opt-level = 3
[profile.dev.package."sonora-simd"]
opt-level = 3
[profile.dev.package."sonora-ns"]
opt-level = 3
[profile.dev.package."sonora-agc2"]
opt-level = 3

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
